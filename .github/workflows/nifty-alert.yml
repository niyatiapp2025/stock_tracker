name: Stock Dip Alert (NIFTY & GOLDBEES)

on:
  schedule:
    # Run every hour during Indian market hours (9:15 AM - 3:15 PM IST)
    # Cron format: minute hour day month day-of-week
    # IST = UTC + 5:30, so :15 IST = :45 UTC (of previous hour)
    # To run at 9:15 AM - 3:15 PM IST, we need 3:45 AM - 9:45 AM UTC
    - cron: '45 3-9 * * 1-5'  # 9:15 AM to 3:15 PM IST (3:45 AM to 9:45 AM UTC), Monday to Friday
  workflow_dispatch:  # Allow manual runs

jobs:
  stock-alert:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy requests pytz
        
    - name: Run Stock Alerts (NIFTY & GOLDBEES)
      env:
        ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      run: |
        python nifty_dip_alert.py
        
    - name: Upload signals database
      uses: actions/upload-artifact@v4
      with:
        name: signals-db
        path: signals.db
        retention-days: 30
